help_text: |-
  shell-switcher — runtime desktop shell switcher

  Usage:
    shell-switcher list                List available shells
    shell-switcher current             Show the currently active shell
    shell-switcher set <name>          Switch to a shell (stop-all → await → start)
    shell-switcher boot                shell-starter entry (start from current marker)
    shell-switcher help                This help

  Config: %{config}
    shell-switcher only orchestrates the switch; systemd services are declared by your NixOS config.
  Safety: refuses to switch outside Hyprland/niri; falls back to %{default} on failure.
